
version: '3.8'

services:
  node-server:
    image: rogerrru/server-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app

    environment:
      - MYSQL_HOST=db
      - MYSQL_ROOT_PASSWORD=''
      - MYSQL_DATABASE=dynamite-database
      - MYSQL_USER=root
      - MYSQL_PASSWORD=''

    depends_on:
      - db

  db:
    image: mysql:latest
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3301:3301"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Dynamite-database.sql:/docker-entrypoint-initdb.d/Dynamite-database.sql

volumes:
  mysql_data:



