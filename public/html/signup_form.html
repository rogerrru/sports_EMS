<script>
    function validateForm() {
        var firstName = document.getElementsByName('firstName')[0].value;
        var lastName = document.getElementsByName('lastName')[0].value;
        var password = document.getElementsByName('password')[0].value;
        var reenterPassword = document.getElementsByName('reenterPassword')[0].value;

        // Regular expression to match alphabets with spaces for multiple words
        var alphabetSpaceRegex = /^[A-Za-z]+(?:\s[A-Za-z]+)*$/;

        // Validate first name
        if (!alphabetSpaceRegex.test(firstName)) {
            alert("Please enter only alphabets for the First Name");
            return false;
        }

        // Validate last name
        if (!alphabetSpaceRegex.test(lastName)) {
            alert("Please enter only alphabets for the Last Name");
            return false;
        }

        // Validate password match
        if (password !== reenterPassword) {
            alert("Passwords do not match. Please re-enter the passwords.");
            return false;
        }

        return true;
    }
</script>
