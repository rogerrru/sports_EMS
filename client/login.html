<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | SLU EMS</title>
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="icon" href="assets/media/ScholoLogo.png" type="image/x-icon" />
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
</head>
<body class="auth-page">
<div class="auth-card">
  <div class="auth-card-header">
    <img src="assets/media/ScholoLogo.png" alt="SLU Logo" />
    <h1>Welcome Back</h1>
    <p>Sign in to your SLU EMS account</p>
  </div>
  <div class="auth-card-body">
    <div id="error-msg" class="alert alert-error"></div>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@slu.edu.ph" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required />
      </div>
      <button type="submit" id="submit-btn" class="btn btn-primary btn-block">Sign In</button>
    </form>
    <p class="auth-footer-link">Don't have an account? <a href="signup.html">Register now</a></p>
  </div>
</div>

<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submit-btn");
  const errEl = document.getElementById("error-msg");
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  btn.disabled = true;
  btn.textContent = "Signing in…";
  errEl.style.display = "none";

  try {
    const user = await window.API.auth.login(email, password);
    window.location.href = user.userType === "admin"
      ? (window.APP_CONFIG.API_BASE_URL + "/events")
      : "index.html";
  } catch (err) {
    errEl.textContent = err.message || "Login failed";
    errEl.style.display = "block";
    btn.disabled = false;
    btn.textContent = "Sign In";
  }
});
</script>
</body>
</html>
